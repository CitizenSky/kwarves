name: ExoFOP catalog regression tests

on:
  pull_request:
    paths:
      - 'dashboard/refresh_exofop_catalog.py'
      - 'dashboard/test_refresh_exofop_catalog.py'
      - 'dashboard/update_archive_data.py'
      - '.github/workflows/exofop-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile and test catalog refresher
        run: |
          python -m py_compile dashboard/refresh_exofop_catalog.py dashboard/update_archive_data.py
          cd dashboard
          python -m unittest -v test_refresh_exofop_catalog
